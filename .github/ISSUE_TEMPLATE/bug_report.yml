name: Bug melden
description: Etwas funktioniert nicht wie erwartet.
title: "fix: "
labels: ["type: bug", "status: triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Schritte zur Reproduktion
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Commit
  - type: textarea
    id: environment
    attributes:
      label: Umgebung
      description: OS, Laufzeit-/Browser-Version usw.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
