name: Feature vorschlagen
description: Idee für eine neue Funktion oder Verbesserung.
title: "feat: "
labels: ["type: feature", "status: triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Welches Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Lösungsvorschlag
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativen
  - type: textarea
    id: context
    attributes:
      label: Zusätzlicher Kontext
