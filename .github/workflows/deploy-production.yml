name: Deploy production

# Rolls out a release to production: website → …github.io/<repo>/, server image → ghcr.io/<repo>:vX.Y.Z + :latest
# Called by the Release workflow when a release PR is merged.
# Run it by hand with an older tag (e.g. v1.2.0) to roll back.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, e.g. v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Ask for approval only when there is something to roll out.
  check:
    name: Anything to deploy?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.what.outputs.site }}
      image: ${{ steps.what.outputs.image }}
      node: ${{ steps.what.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: What is there to deploy?
        id: what
        run: |
          if grep -qE '^site:' Makefile 2>/dev/null; then echo "site=true" >> "$GITHUB_OUTPUT"; fi
          if [ -f Dockerfile ]; then echo "image=true" >> "$GITHUB_OUTPUT"; fi
          if [ -f package.json ]; then echo "node=true" >> "$GITHUB_OUTPUT"; fi
          if ! grep -qE '^site:' Makefile 2>/dev/null && [ ! -f Dockerfile ]; then
            echo "Nothing to deploy yet (no website or Dockerfile)." >> "$GITHUB_STEP_SUMMARY"
          fi

  production:
    name: Deploy production
    needs: check
    if: needs.check.outputs.site == 'true' || needs.check.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.pages.outputs.url }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.check.outputs.site == 'true' && needs.check.outputs.node == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Build and publish website
        id: pages
        if: needs.check.outputs.site == 'true'
        run: make setup site && ./scripts/publish-pages.sh production site
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: ${{ vars.PAGES_URL }}
      - name: Build and push server image
        if: needs.check.outputs.image == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:$TAG" -t "$image:latest" .
          docker push "$image:$TAG" && docker push "$image:latest"
          echo "🚀 Server image: \`$image:$TAG\`" >> "$GITHUB_STEP_SUMMARY"
