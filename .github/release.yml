# Categories for GitHub's auto-generated release notes (Releases → "Generate release notes").
changelog:
  exclude:
    labels: ["autorelease: pending", "autorelease: tagged"]
  categories:
    - title: "Breaking Changes"
      labels: ["breaking change"]
    - title: "Features"
      labels: ["type: feature"]
    - title: "Bug Fixes"
      labels: ["type: bug"]
    - title: "Security"
      labels: ["type: security"]
    - title: "Dependencies"
      labels: ["type: dependencies"]
    - title: "Other Changes"
      labels: ["*"]
