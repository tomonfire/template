# Labels as code – synced by .github/workflows/labels.yml.
# Scheme: "<group>: <value>" so labels sort and filter nicely.
- name: "type: bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "type: feature"
  color: "a2eeef"
  description: "New feature or request"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type: chore"
  color: "fef2c0"
  description: "Maintenance, refactoring, tooling"
- name: "type: ci"
  color: "ededed"
  description: "CI/CD and automation"
- name: "type: security"
  color: "b60205"
  description: "Security related"
- name: "type: dependencies"
  color: "0366d6"
  description: "Dependency updates"
- name: "priority: high"
  color: "e11d21"
  description: "Needs attention soon"
- name: "priority: low"
  color: "c2e0c6"
  description: "Nice to have"
- name: "status: triage"
  color: "fbca04"
  description: "Needs triage"
- name: "status: blocked"
  color: "000000"
  description: "Blocked by something else"
- name: "status: in progress"
  color: "1d76db"
  description: "Being worked on"
- name: "breaking change"
  color: "b60205"
  description: "Introduces a breaking change"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
- name: "area: ai-tooling"
  color: "5319e7"
  description: "Claude Code, graphify, agent config"
- name: "autorelease: pending"
  color: "ededed"
  description: "Release PR managed by release-please"
- name: "autorelease: tagged"
  color: "ededed"
  description: "Released by release-please"
