# Project-scoped Codex configuration (loaded when the project is trusted).
# Exposes the graphify knowledge graph as MCP tools (query_graph, get_node,
# get_neighbors, shortest_path, god_nodes, ...).
# Requires: uv tool install "graphifyy[mcp]"   (provides the `graphify-mcp` command)

[mcp_servers.graphify]
command = "graphify-mcp"
args = ["graphify-out/graph.json"]
startup_timeout_sec = 20
